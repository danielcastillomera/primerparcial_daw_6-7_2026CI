    <main class="sombra">
      <h2>Calificaciones</h2>
      <p>En esta sección encontrarás las calificaciones de los estudiantes.</p>
      <h2>Contacto</h2>

      <form class="formulario">
        <fieldset>
          <legend>Contáctame</legend>

          <div class="contenedor-campos">
            <div class="campo">
              <label>Nombre</label>
              <input class="input-text" type="text" placeholder="Nombre" />
            </div>
            <div class="campo">
              <label>Correo</label>
              <input class="input-text" type="email" placeholder="Correo" />
            </div>
            <div class="campo">
              <label>Teléfono</label>
              <input class="input-text" type="tel" placeholder="Teléfono" />
            </div>
            <div class="campo">
              <label>Mensaje</label>
              <textarea class="input-text" placeholder="Escribe tu mensaje aquí..."></textarea>
            </div>
          </div>
          <div class="enviar">
            <input class="boton" type="submit" value="Enviar" />
          </div>
        </fieldset>
      </form>
    </main>
